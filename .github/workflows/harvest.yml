name: "CHERRY"
run-name: "POPLAR"
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  pages: write
jobs:
  ridge:
    concurrency:
      group: "RADIANCE-${{ github.ref_name }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.HAZEL.outputs.page_url }}
    steps:
      - name: "Prairie"
        uses: actions/checkout@v7
      - name: "Bison"
        uses: actions/configure-pages@v6
      - name: "paddock"
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: "rowan"
        id: HAZEL
        uses: actions/deploy-pages@v5
